<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>チャンネル分け表作成ツール</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#dde3ec;
        --card:#ffffff;
        --ink:#1f2937;
        --ink-dim:rgba(31,41,55,.62);
        --line:#c3cad6;
        --field-bg:#ffffff;
        --accent:#ff9f1a;
        --accent-ink:#231a04;
        --navy:#1e3a5f;
        --sky:#7dd3fc;
        --sky-ink:#0c3a52;
        --danger:#dc2626;
        --bar-bg:rgba(255,255,255,.96);
        --shadow:0 1px 3px rgba(15,23,42,.10),0 4px 14px rgba(15,23,42,.06);
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#171e29;
          --card:#232d3d;
          --ink:#eef2f7;
          --ink-dim:rgba(238,242,247,.6);
          --line:#43506a;
          --field-bg:#1b2432;
          --bar-bg:rgba(27,36,50,.97);
          --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
        }
      }
      *{ box-sizing:border-box; }
      html{ -webkit-text-size-adjust:100%; }
      body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","Noto Sans JP",sans-serif;
        font-weight:700;
        touch-action:manipulation;
        padding-bottom:196px;
      }
      button{ font-family:inherit; font-weight:700; cursor:pointer; }
      button, select, input:not([type="checkbox"],[type="radio"]), textarea{ min-height:2rem; }
      [hidden]{ display:none !important; }

      /* ---------- empty state ---------- */
      #emptyState{
        min-height:100svh;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; padding:24px 20px 120px; gap:14px;
      }
      .kicker{
        font-family:"Noto Sans JP","Hiragino Sans",sans-serif;
        font-weight:900; font-size:20px; color:#000; letter-spacing:.02em;
      }
      @media (prefers-color-scheme: dark){ .kicker{ color:#fff; } }
      #emptyState h1{ margin:0; font-size:30px; font-weight:700; line-height:1.35; }
      .create-btn{
        margin-top:14px; border:none; border-radius:16px;
        background:var(--accent); color:var(--accent-ink);
        font-size:20px; font-weight:700; padding:16px 44px; min-height:56px;
        box-shadow:var(--shadow);
      }
      .create-btn:active{ transform:scale(.98); }

      /* ---------- layout ---------- */
      .wrap{ max-width:920px; margin:0 auto; padding:12px 12px 8px; }
      .card{
        background:var(--card); border-radius:14px; box-shadow:var(--shadow);
        padding:14px; margin-bottom:12px;
      }
      .card h2{ margin:0 0 12px; font-size:17px; font-weight:700; }
      .topbar{ display:flex; flex-direction:column; gap:10px; }
      .new-sheet-btn{
        align-self:flex-start; border:2px solid var(--line); background:var(--card);
        color:var(--ink); border-radius:999px; padding:8px 18px; font-size:15px; min-height:40px;
      }
      #pillRow{ display:flex; flex-wrap:wrap; gap:8px; }
      .pill-btn{
        border:2px solid var(--line); background:var(--field-bg); color:var(--ink);
        border-radius:999px; padding:7px 16px; font-size:15px; min-height:38px;
        max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      }
      .pill-btn.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
      .save-status{ font-size:13px; color:var(--ink-dim); }
      .sheet-actions{ display:flex; gap:8px; }
      .mini-btn{
        border:2px solid var(--line); background:var(--field-bg); color:var(--ink);
        border-radius:10px; padding:6px 14px; font-size:13px; min-height:36px;
      }
      .mini-btn.danger{ color:var(--danger); border-color:var(--danger); }

      /* ---------- fields & hint-span inputs ---------- */
      .field{ margin-bottom:12px; }
      .field:last-child{ margin-bottom:0; }
      .field label, .field .flabel{ display:block; font-size:14px; margin-bottom:6px; }
      .hint-wrap{ position:relative; }
      .hint-wrap input, .hint-wrap textarea{
        width:100%; font-family:inherit; font-weight:700; font-size:16px;
        color:var(--ink); background:var(--field-bg);
        border:2px solid var(--line); border-radius:10px;
        padding:10px 12px; min-height:44px; display:block;
      }
      .hint-wrap textarea{ min-height:76px; resize:vertical; line-height:1.5; }
      .hint-wrap input:focus, .hint-wrap textarea:focus{ outline:none; border-color:var(--navy); }
      .hint-text{
        position:absolute; left:12px; top:50%; transform:translateY(-50%);
        font-size:16px; font-weight:700; color:rgba(128,138,155,.85);
        pointer-events:none; white-space:nowrap; overflow:hidden; max-width:calc(100% - 24px);
        display:none;
      }
      @media (prefers-color-scheme: dark){ .hint-text{ color:rgba(200,210,225,.5); } }
      .hint-wrap.empty .hint-text{ display:block; }
      .hint-wrap.thin .hint-text{ color:rgba(150,160,178,.55); }
      @media (prefers-color-scheme: dark){ .hint-wrap.thin .hint-text{ color:rgba(200,210,225,.32); } }
      .hint-wrap.area .hint-text{ top:12px; transform:none; white-space:normal; }
      .hint-wrap.small-hint .hint-text{
        font-size:10.5px; line-height:1.25; white-space:normal; color:rgba(120,128,142,.75);
      }
      input[type="date"]{
        width:100%; font-family:inherit; font-weight:700; font-size:16px;
        color:var(--ink); background:var(--field-bg);
        border:2px solid var(--line); border-radius:10px; padding:10px 12px; min-height:44px;
      }
      select{
        width:100%; font-family:inherit; font-weight:700; font-size:15px;
        color:var(--ink); background:var(--field-bg);
        border:2px solid var(--line); border-radius:10px; padding:9px 10px; min-height:44px;
      }
      .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
      @media (max-width:560px){ .grid2{ grid-template-columns:1fr; } }

      /* ---------- channel editor ---------- */
      .scenes{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
      @media (max-width:720px){ .scenes{ grid-template-columns:1fr; } }
      .scene-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
      .scene-label{ font-size:15px; white-space:nowrap; }
      .scene-head .hint-wrap{ flex:1 1 130px; min-width:120px; }
      .scene-head .hint-wrap input{ border-radius:999px; }
      .copy-btn{
        border:none; border-radius:999px; background:var(--sky); color:var(--sky-ink);
        font-size:13px; padding:8px 14px; min-height:38px; white-space:nowrap;
      }
      .scene-note{ font-size:11px; color:var(--ink-dim); white-space:nowrap; }
      table.edit-table{ width:100%; border-collapse:collapse; }
      table.edit-table th{
        font-size:14px; text-align:center; padding:4px 6px; color:var(--ink);
      }
      table.edit-table td{ padding:3px 4px; vertical-align:middle; }
      td.track-name{ width:64px; text-align:center; font-size:14px; white-space:nowrap; }
      td.track-name.mix{ color:var(--danger); }
      td.content-cell .hint-wrap input{ min-height:38px; padding:7px 9px; font-size:15px; border-radius:8px; }
      td.content-cell .hint-wrap .hint-text{ left:9px; }

      /* ---------- cameras editor ---------- */
      .cam-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
      .cam-block{ border:2px solid var(--line); border-radius:12px; padding:10px; }
      .cam-block-head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
      .cam-block-label{ font-size:11px; }
      .cam-block-note{ font-size:10px; color:var(--ink-dim); }
      .cam-block .hint-wrap input{ height:42px; min-height:42px; }
      .cam-ch-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
      .cam-ch-row .ch-label{ font-size:11px; color:var(--ink-dim); margin-bottom:4px; }
      .cam-copy-btn{
        margin-top:10px; width:100%; border:none; border-radius:10px;
        background:var(--sky); color:var(--sky-ink); font-size:13px; padding:9px 10px; min-height:38px;
      }

      /* ---------- preview ---------- */
      .zoom-bar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
      .zoom-bar .spacer{ flex:1; }
      .zoom-btn{
        width:44px; height:44px; border-radius:50%; border:2px solid var(--line);
        background:var(--field-bg); color:var(--ink); font-size:20px; line-height:1;
      }
      .zoom-fit-btn{
        border:2px solid var(--line); background:var(--field-bg); color:var(--ink);
        border-radius:999px; padding:8px 16px; font-size:14px; min-height:44px;
      }
      #previewViewport, .viewer-viewport{
        position:relative; overflow:hidden; border-radius:10px;
        background:#9aa5b5;
      }
      #previewViewport{ height:min(78vh,900px); }
      .zoom-stage{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }

      /* ---------- sheet (A4 portrait, 794px wide) ---------- */
      .sheet{
        width:794px; min-height:1123px; background:#fff; color:#000;
        padding:32px; display:flex; flex-direction:column;
        font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","Noto Sans JP",sans-serif;
        font-weight:700; box-shadow:0 2px 10px rgba(0,0,0,.25);
      }
      .sheet-title{ text-align:center; font-weight:700; font-size:27px; line-height:1.3; white-space:nowrap; margin:2px 0 16px; }
      .sheet-card{
        align-self:flex-start; background:#000; color:#fff; font-weight:900; font-size:21px;
        border-radius:16px; padding:10px 20px; margin-bottom:18px; line-height:1.3;
      }
      .sheet-tables{ display:flex; gap:20px; margin-bottom:20px; }
      .sheet-table-col{ width:calc((100% - 20px)/2); flex:none; }
      .sheet-pill{
        display:inline-block; border:2px solid #9ca3af; border-radius:999px;
        padding:4px 16px; font-size:16px; margin-bottom:8px; line-height:1.35;
        max-width:100%;
      }
      .sheet-pill.pink{ background:#fbcfe8; }
      .sheet-pill.blue{ background:#bae6fd; }
      table.sheet-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
      table.sheet-table td{
        border:1px solid #000; padding:5px 8px; font-size:15px; line-height:1.35;
        height:31px; vertical-align:middle; word-break:break-all;
      }
      table.sheet-table td.st-track{ width:86px; text-align:center; }
      table.sheet-table td.st-track.mix{ color:#dc2626; }
      table.sheet-table td.st-content{ text-align:left; }
      table.sheet-table tr.zebra td{ background:#f5f5f5; }
      table.sheet-table td.mix-last{ border-bottom:4px double #000; }
      .sheet-rec{ margin-bottom:20px; }
      .sheet-rec-head{ font-size:17px; margin-bottom:6px; }
      .sheet-rec-head .tx{ text-decoration:underline; text-underline-offset:3px; }
      .sheet-rec-line{ font-size:16px; line-height:1.5; }
      .sheet-rec-line2{ font-size:16px; line-height:1.5; white-space:nowrap; }
      .sheet-cam{ margin-bottom:18px; }
      .sheet-cam-head{
        display:inline-block; border:2px solid #000; padding:3px 14px;
        font-size:26px; line-height:1.3; text-align:center; margin-bottom:8px;
      }
      .sheet-cam-chs{ display:flex; align-items:stretch; }
      .sheet-cam-bracket{ font-size:58px; line-height:48px; height:48px; font-weight:400; margin-right:6px; }
      .sheet-cam-lines{ display:flex; flex-direction:column; }
      .sheet-cam-line{ font-size:17px; line-height:24px; height:24px; white-space:nowrap; }
      .sheet-memo{ font-size:15px; line-height:1.6; white-space:pre-wrap; word-break:break-all; margin-bottom:16px; }
      .sheet-staff{ margin-top:auto; text-align:right; font-size:16px; padding-top:12px; }

      .capture-holder{ position:fixed; left:-10000px; top:0; width:794px; }
      .capture-holder .sheet{ box-shadow:none; }

      /* ---------- bottom bar ---------- */
      .bottom-bar{
        position:fixed; left:0; right:0; bottom:0; z-index:40;
        background:var(--bar-bg); border-top:1px solid var(--line);
        padding:10px 12px calc(10px + env(safe-area-inset-bottom));
        display:flex; flex-direction:column; gap:8px;
        max-width:920px; margin:0 auto;
      }
      .out-btn{
        width:100%; border:none; border-radius:12px; font-size:15px;
        padding:11px 12px; min-height:44px;
      }
      .out-btn.pdf-open{ background:var(--navy); color:#fff; }
      .out-btn.png{ background:var(--field-bg); color:var(--ink); border:2px solid var(--line); }
      .out-btn.pdf{ background:var(--accent); color:var(--accent-ink); }

      /* ---------- overlays ---------- */
      .overlay{
        position:fixed; inset:0; z-index:60; background:rgba(10,14,20,.92);
        display:flex; flex-direction:column;
      }
      .overlay-bar{
        display:flex; align-items:center; gap:8px; padding:10px 12px;
        padding-top:calc(10px + env(safe-area-inset-top));
      }
      .overlay-bar .grow{ flex:1; }
      .ov-btn{
        border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.1); color:#fff;
        border-radius:999px; padding:8px 16px; font-size:14px; min-height:40px;
      }
      .ov-btn.share{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
      .viewer-viewport{ flex:1; background:#3a4353; border-radius:0; }
      .viewer-zoombar{ display:flex; gap:8px; justify-content:center; padding:12px; }
      .panel-overlay{
        position:fixed; inset:0; z-index:70; background:rgba(10,14,20,.55);
        display:flex; align-items:center; justify-content:center; padding:20px;
      }
      .panel{
        background:var(--card); color:var(--ink); border-radius:16px; padding:20px;
        width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px;
        box-shadow:var(--shadow);
      }
      .panel p{ margin:0 0 4px; font-size:15px; line-height:1.5; }
      .panel .out-btn{ min-height:48px; }
      #processing{
        position:fixed; inset:0; z-index:80; background:rgba(10,14,20,.6);
        display:flex; align-items:center; justify-content:center;
        color:#fff; font-size:17px;
      }
    </style>
  </head>
  <body>
    <!-- empty state -->
    <div id="emptyState" hidden>
      <div class="kicker">ZOOM F8n Pro</div>
      <h1>チャンネル分け表作成ツール</h1>
      <button class="create-btn" id="createFirstBtn" type="button">作成する</button>
    </div>

    <!-- main UI -->
    <div id="mainUI" hidden>
      <div class="wrap">
        <div class="card topbar">
          <button class="new-sheet-btn" id="newSheetBtn" type="button">＋ 新しいシート</button>
          <div id="pillRow"></div>
          <div class="save-status" id="saveStatus">✓ 保存済み</div>
          <div class="sheet-actions">
            <button class="mini-btn" id="dupBtn" type="button">複製</button>
            <button class="mini-btn danger" id="delBtn" type="button">削除</button>
          </div>
        </div>

        <div id="editorRoot"></div>

        <div class="card">
          <div class="zoom-bar">
            <span style="font-size:15px;">プレビュー</span>
            <span class="spacer"></span>
            <button class="zoom-btn" id="pvMinus" type="button" aria-label="縮小">−</button>
            <button class="zoom-btn" id="pvPlus" type="button" aria-label="拡大">＋</button>
            <button class="zoom-fit-btn" id="pvFit" type="button">全体表示</button>
          </div>
          <div id="previewViewport">
            <div class="zoom-stage" id="previewStage"></div>
          </div>
        </div>
      </div>

      <div class="bottom-bar">
        <button class="out-btn pdf-open" id="btnPdfOpen" type="button">PDFを開く</button>
        <button class="out-btn png" id="btnPng" type="button">画像（PNG）で出力</button>
        <button class="out-btn pdf" id="btnPdf" type="button">PDFで出力</button>
      </div>
    </div>

    <!-- full-screen viewer -->
    <div class="overlay" id="viewer" hidden>
      <div class="overlay-bar">
        <button class="ov-btn" id="viewerClose" type="button">閉じる</button>
        <span class="grow"></span>
        <button class="ov-btn share" id="viewerShare" type="button">保存・共有する</button>
      </div>
      <div class="viewer-viewport" id="viewerViewport">
        <div class="zoom-stage" id="viewerStage"></div>
      </div>
      <div class="viewer-zoombar">
        <button class="zoom-btn" id="vwMinus" type="button" aria-label="縮小">−</button>
        <button class="zoom-btn" id="vwPlus" type="button" aria-label="拡大">＋</button>
        <button class="zoom-fit-btn" id="vwFit" type="button">全体表示</button>
      </div>
    </div>

    <!-- result / confirm panel -->
    <div class="panel-overlay" id="panelOverlay" hidden>
      <div class="panel" id="panelBox"></div>
    </div>

    <div id="processing" hidden>出力中…</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
"use strict";
/* ================= state ================= */
var LS_KEY = "f8nChannelSheets.v1";
var TRACKS = ["MIX-L","MIX-R","Tr-1","Tr-2","Tr-3","Tr-4","Tr-5","Tr-6","Tr-7","Tr-8"];
var REC_POLY = "ポリ（全TrがまとまったWAVファイル）";
var REC_MONO = "モノ（全て個別のWAVファイル）";

function uid(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function blankCam(){ return { title:"", ch1:"", ch2:"" }; }
function blankSheet(){
  return {
    id: uid(),
    program: "", date: "", staff: "",
    sampleRate: "48kHz", bitDepth: "24bit", fileFormat: "WAV",
    recFormat: REC_POLY,
    scene1Title: "", scene2Title: "",
    scene1: TRACKS.map(function(){ return ""; }),
    scene2: TRACKS.map(function(){ return ""; }),
    cameras: [blankCam(), blankCam(), blankCam(), blankCam()],
    memo: ""
  };
}
function normalizeSheet(s){
  var b = blankSheet();
  if(!s || typeof s !== "object") return b;
  Object.keys(b).forEach(function(k){ if(s[k] !== undefined) b[k] = s[k]; });
  if(!Array.isArray(b.scene1) || b.scene1.length !== 10) b.scene1 = blankSheet().scene1;
  if(!Array.isArray(b.scene2) || b.scene2.length !== 10) b.scene2 = blankSheet().scene2;
  if(!Array.isArray(b.cameras) || b.cameras.length !== 4) b.cameras = blankSheet().cameras;
  b.cameras = b.cameras.map(function(c){ return { title:(c&&c.title)||"", ch1:(c&&c.ch1)||"", ch2:(c&&c.ch2)||"" }; });
  return b;
}
var state = { sheets: [], activeId: null };
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.sheets)){
        state.sheets = parsed.sheets.map(normalizeSheet);
        state.activeId = parsed.activeId || (state.sheets[0] && state.sheets[0].id) || null;
      }
    }
  }catch(e){ /* storage unavailable: run in-memory */ }
}
function activeSheet(){
  for(var i=0;i<state.sheets.length;i++) if(state.sheets[i].id === state.activeId) return state.sheets[i];
  return state.sheets[0] || null;
}
var saveTimer = null;
function saveSoon(){
  var st = document.getElementById("saveStatus");
  if(st) st.textContent = "保存中…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
    var st2 = document.getElementById("saveStatus");
    if(st2) st2.textContent = "✓ 保存済み";
  }, 250);
}
function fmtDate(iso){
  if(!iso) return "";
  var p = iso.split("-");
  if(p.length !== 3) return iso;
  return p[0] + "/" + Number(p[1]) + "/" + Number(p[2]);
}
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ================= hint-span inputs ================= */
/* Hints are overlaid spans sized exactly like the input text.
   No native placeholder attribute is used anywhere. */
function makeHintInput(opts){
  var wrap = document.createElement("div");
  wrap.className = "hint-wrap" + (opts.thin ? " thin" : "") + (opts.smallHint ? " small-hint" : "");
  var input = document.createElement("input");
  input.type = "text";
  input.value = opts.value || "";
  input.setAttribute("autocomplete","off");
  if(opts.inputClass) input.className = opts.inputClass;
  var hint = document.createElement("span");
  hint.className = "hint-text";
  hint.textContent = opts.hint || "";
  wrap.appendChild(input);
  if(opts.hint) wrap.appendChild(hint);
  function sync(){ wrap.classList.toggle("empty", input.value === ""); }
  sync();
  input.addEventListener("input", function(){
    sync();
    opts.onInput(input.value);
  });
  return wrap;
}
function makeHintTextarea(opts){
  var wrap = document.createElement("div");
  wrap.className = "hint-wrap area";
  var ta = document.createElement("textarea");
  ta.value = opts.value || "";
  var hint = document.createElement("span");
  hint.className = "hint-text";
  hint.textContent = opts.hint || "";
  wrap.appendChild(ta);
  wrap.appendChild(hint);
  function sync(){ wrap.classList.toggle("empty", ta.value === ""); }
  sync();
  ta.addEventListener("input", function(){ sync(); opts.onInput(ta.value); });
  return wrap;
}
function labeledField(labelText, control){
  var f = document.createElement("div");
  f.className = "field";
  var l = document.createElement("span");
  l.className = "flabel";
  l.textContent = labelText;
  f.appendChild(l);
  f.appendChild(control);
  return f;
}
function makeSelect(value, options, onChange){
  var sel = document.createElement("select");
  options.forEach(function(o){
    var op = document.createElement("option");
    op.value = o; op.textContent = o;
    sel.appendChild(op);
  });
  sel.value = value;
  sel.addEventListener("change", function(){ onChange(sel.value); });
  return sel;
}

/* ================= editor ================= */
var editorRoot = document.getElementById("editorRoot");
function changed(){
  saveSoon();
  renderPills();
  schedulePreview();
}
function renderEditor(){
  var sh = activeSheet();
  editorRoot.innerHTML = "";
  if(!sh) return;

  /* --- basic info --- */
  var basic = document.createElement("div");
  basic.className = "card";
  basic.innerHTML = "<h2>基本情報</h2>";
  basic.appendChild(labeledField("番組名", makeHintInput({
    value: sh.program, hint: "番組名", thin: true,
    onInput: function(v){ sh.program = v; changed(); }
  })));
  var dateInput = document.createElement("input");
  dateInput.type = "date";
  dateInput.value = sh.date || "";
  dateInput.addEventListener("change", function(){ sh.date = dateInput.value; changed(); });
  dateInput.addEventListener("input", function(){ sh.date = dateInput.value; changed(); });
  basic.appendChild(labeledField("収録日", dateInput));
  basic.appendChild(labeledField("収録担当", makeHintInput({
    value: sh.staff, hint: "収録担当", thin: true,
    onInput: function(v){ sh.staff = v; changed(); }
  })));
  editorRoot.appendChild(basic);

  /* --- recorder settings --- */
  var rec = document.createElement("div");
  rec.className = "card";
  rec.innerHTML = "<h2>レコーダー設定</h2>";
  var grid = document.createElement("div");
  grid.className = "grid2";
  grid.appendChild(labeledField("サンプルレート", makeSelect(sh.sampleRate,
    ["44.1kHz","47.952kHz","48kHz","48.048kHz","88.2kHz","96kHz","176.4kHz","192kHz"],
    function(v){ sh.sampleRate = v; changed(); })));
  grid.appendChild(labeledField("ビット深度", makeSelect(sh.bitDepth,
    ["16bit","24bit","32bit float"],
    function(v){ sh.bitDepth = v; changed(); })));
  grid.appendChild(labeledField("ファイル形式", makeSelect(sh.fileFormat,
    ["WAV","WAV（BWF）"],
    function(v){ sh.fileFormat = v; changed(); })));
  rec.appendChild(grid);
  rec.appendChild(labeledField("録音ファイル形式", makeSelect(sh.recFormat,
    [REC_POLY, REC_MONO],
    function(v){ sh.recFormat = v; changed(); })));
  editorRoot.appendChild(rec);

  /* --- channels --- */
  var chCard = document.createElement("div");
  chCard.className = "card";
  chCard.innerHTML = "<h2>チャンネル割り当て</h2>";
  var scenes = document.createElement("div");
  scenes.className = "scenes";
  scenes.appendChild(buildSceneEditor(sh, 1));
  scenes.appendChild(buildSceneEditor(sh, 2));
  chCard.appendChild(scenes);
  editorRoot.appendChild(chCard);

  /* --- cameras --- */
  var camCard = document.createElement("div");
  camCard.className = "card";
  camCard.innerHTML = "<h2>カメラ</h2>";
  var camGrid = document.createElement("div");
  camGrid.className = "cam-grid";
  sh.cameras.forEach(function(cam, idx){
    camGrid.appendChild(buildCamBlock(sh, cam, idx));
  });
  camCard.appendChild(camGrid);
  editorRoot.appendChild(camCard);

  /* --- memo --- */
  var memo = document.createElement("div");
  memo.className = "card";
  memo.innerHTML = "<h2>全体メモ</h2>";
  memo.appendChild(makeHintTextarea({
    value: sh.memo, hint: "引き継ぎ事項、注意点など",
    onInput: function(v){ sh.memo = v; changed(); }
  }));
  editorRoot.appendChild(memo);
}

function buildSceneEditor(sh, num){
  var key = num === 1 ? "scene1" : "scene2";
  var titleKey = num === 1 ? "scene1Title" : "scene2Title";
  var box = document.createElement("div");

  var head = document.createElement("div");
  head.className = "scene-head";
  var label = document.createElement("span");
  label.className = "scene-label";
  label.textContent = "シーン" + num;
  head.appendChild(label);
  head.appendChild(makeHintInput({
    value: sh[titleKey], hint: "シーン/場所/",
    onInput: function(v){ sh[titleKey] = v; changed(); }
  }));
  if(num === 2){
    var copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "copy-btn";
    copyBtn.textContent = "シーン1から内容をコピー";
    copyBtn.addEventListener("click", function(){
      sh.scene2 = sh.scene1.slice();
      saveSoon(); renderEditor(); schedulePreview();
    });
    head.appendChild(copyBtn);
    var note = document.createElement("span");
    note.className = "scene-note";
    note.textContent = "※空欄時はPDFに出力されない";
    head.appendChild(note);
  }
  box.appendChild(head);

  var table = document.createElement("table");
  table.className = "edit-table";
  var thead = document.createElement("thead");
  thead.innerHTML = "<tr><th style='width:64px'>Tr</th><th>内容</th></tr>";
  table.appendChild(thead);
  var tbody = document.createElement("tbody");
  TRACKS.forEach(function(track, i){
    var tr = document.createElement("tr");
    var tdName = document.createElement("td");
    tdName.className = "track-name" + (i < 2 ? " mix" : "");
    tdName.textContent = track;
    tr.appendChild(tdName);
    var tdContent = document.createElement("td");
    tdContent.className = "content-cell";
    tdContent.appendChild(makeHintInput({
      value: sh[key][i],
      hint: i < 2 ? "※空欄時はPDFに出力されない" : "",
      smallHint: i < 2,
      onInput: function(v){ sh[key][i] = v; changed(); }
    }));
    tr.appendChild(tdContent);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
  return box;
}

function buildCamBlock(sh, cam, idx){
  var block = document.createElement("div");
  block.className = "cam-block";
  var head = document.createElement("div");
  head.className = "cam-block-head";
  var lab = document.createElement("span");
  lab.className = "cam-block-label";
  lab.textContent = "カメラ番号" + (idx + 1);
  var note = document.createElement("span");
  note.className = "cam-block-note";
  note.textContent = "※空欄時はPDFに出力されない";
  head.appendChild(lab);
  head.appendChild(note);
  block.appendChild(head);

  block.appendChild(makeHintInput({
    value: cam.title, hint: "カメラ番号",
    onInput: function(v){ cam.title = v; changed(); }
  }));

  var row = document.createElement("div");
  row.className = "cam-ch-row";
  [["1ch","ch1"],["2ch","ch2"]].forEach(function(pair){
    var cell = document.createElement("div");
    var cl = document.createElement("div");
    cl.className = "ch-label";
    cl.textContent = pair[0];
    cell.appendChild(cl);
    cell.appendChild(makeHintInput({
      value: cam[pair[1]], hint: "",
      onInput: function(v){ cam[pair[1]] = v; changed(); }
    }));
    row.appendChild(cell);
  });
  block.appendChild(row);

  if(idx === 0){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cam-copy-btn";
    btn.textContent = "その他のカメラに値をコピー";
    btn.addEventListener("click", function(){
      for(var i = 1; i < 4; i++){
        sh.cameras[i].ch1 = sh.cameras[0].ch1;
        sh.cameras[i].ch2 = sh.cameras[0].ch2;
      }
      saveSoon(); renderEditor(); schedulePreview();
    });
    block.appendChild(btn);
  }
  return block;
}

  if(sh.program) return sh.program;
  if(sh.date) return fmtDate(sh.date);
  return "シート";
}
function renderPills(){
  var row = document.getElementById("pillRow");
  row.innerHTML = "";
  state.sheets.forEach(function(sh){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pill-btn" + (sh.id === state.activeId ? " active" : "");
    b.textContent = sheetLabel(sh);
    b.addEventListener("click", function(){
      state.activeId = sh.id;
      saveSoon(); renderPills(); renderEditor(); schedulePreview(true);
    });
    row.appendChild(b);
  });
}
function refreshChrome(){
  var has = state.sheets.length > 0;
  document.getElementById("emptyState").hidden = has;
  document.getElementById("mainUI").hidden = !has;
}
function addSheet(){
  var sh = blankSheet();
  state.sheets.push(sh);
  state.activeId = sh.id;
  saveSoon(); refreshChrome(); renderPills(); renderEditor(); schedulePreview(true);
}
document.getElementById("createFirstBtn").addEventListener("click", addSheet);
document.getElementById("newSheetBtn").addEventListener("click", addSheet);
document.getElementById("dupBtn").addEventListener("click", function(){
  var sh = activeSheet();
  if(!sh) return;
  var copy = normalizeSheet(JSON.parse(JSON.stringify(sh)));
  copy.id = uid();
  var idx = state.sheets.indexOf(sh);
  state.sheets.splice(idx + 1, 0, copy);
  state.activeId = copy.id;
  saveSoon(); renderPills(); renderEditor(); schedulePreview(true);
});
document.getElementById("delBtn").addEventListener("click", function(){
  var sh = activeSheet();
  if(!sh) return;
  showPanel(
    "このシートを削除しますか？",
    [
      { label: "削除する", cls: "pdf", action: function(){
          state.sheets = state.sheets.filter(function(s){ return s.id !== sh.id; });
          if(state.activeId === sh.id) state.activeId = state.sheets.length ? state.sheets[0].id : null;
          saveSoon(); refreshChrome(); renderPills(); renderEditor(); schedulePreview(true);
        } },
      { label: "キャンセル", cls: "png", action: null }
    ]
  );
});

/* ================= sheet rendering (preview & capture share this) ================= */
function txSpan(text){ return "<span class='tx'>" + esc(text) + "</span>"; }

function buildSheetTable(sh, num){
  var contents = num === 1 ? sh.scene1 : sh.scene2;
  var rows = [];
  contents.forEach(function(c, i){
    if(i < 2 && !c) return; /* blank MIX rows are omitted */
    rows.push({ track: TRACKS[i], content: c, mix: i < 2 });
  });
  var lastMixIdx = -1;
  rows.forEach(function(r, i){ if(r.mix) lastMixIdx = i; });
  var html = "<table class='sheet-table'>";
  rows.forEach(function(r, i){
    html += "<tr" + (i % 2 === 1 ? " class='zebra'" : "") + ">";
    html += "<td class='st-track" + (r.mix ? " mix" : "") + (i === lastMixIdx ? " mix-last" : "") + "'>" + txSpan(r.track) + "</td>";
    html += "<td class='st-content" + (i === lastMixIdx ? " mix-last" : "") + "'>" + txSpan(r.content) + "</td>";
    html += "</tr>";
  });
  html += "</table>";
  return html;
}

function buildSheet(sh){
  var el = document.createElement("div");
  el.className = "sheet";

  var titleParts = [];
  if(sh.date) titleParts.push(fmtDate(sh.date));
  if(sh.program) titleParts.push(sh.program);
  titleParts.push("音声チャンネル分け");
  var title = document.createElement("div");
  title.className = "sheet-title";
  title.innerHTML = txSpan(titleParts.join(" "));
  el.appendChild(title);

  var card = document.createElement("div");
  card.className = "sheet-card";
  card.innerHTML = txSpan("音声収録 wavデータ");
  el.appendChild(card);

  var tables = document.createElement("div");
  tables.className = "sheet-tables";
  var col1 = document.createElement("div");
  col1.className = "sheet-table-col";
  col1.innerHTML =
    "<div class='sheet-pill pink'>" + txSpan(sh.scene1Title || "シーン/場所/") + "</div>" +
    buildSheetTable(sh, 1);
  tables.appendChild(col1);
  var col2 = document.createElement("div");
  col2.className = "sheet-table-col";
  if(sh.scene2Title){
    col2.innerHTML =
      "<div class='sheet-pill blue'>" + txSpan(sh.scene2Title) + "</div>" +
      buildSheetTable(sh, 2);
  }
  tables.appendChild(col2);
  el.appendChild(tables);

  var rec = document.createElement("div");
  rec.className = "sheet-rec";
  var recShort = sh.recFormat === REC_MONO ? "モノ" : "ポリ";
  rec.innerHTML =
    "<div class='sheet-rec-head'>" + txSpan("※レコーダー設定") + "</div>" +
    "<div class='sheet-rec-line'>" + txSpan("録音ファイル形式：" + recShort + "（" + (sh.recFormat === REC_MONO ? "全て個別のWAVファイル" : "全TrがまとまったWAVファイル") + "）") + "</div>" +
    "<div class='sheet-rec-line2'>" + txSpan("サンプルレート：" + sh.sampleRate + "／ビット深度：" + sh.bitDepth + "／ファイル形式：" + sh.fileFormat) + "</div>";
  el.appendChild(rec);

  sh.cameras.forEach(function(cam){
    if(!cam.title) return;
    var block = document.createElement("div");
    block.className = "sheet-cam";
    block.innerHTML =
      "<div class='sheet-cam-head'>" + txSpan(cam.title) + "</div>" +
      "<div class='sheet-cam-chs'>" +
        "<div class='sheet-cam-bracket'>（</div>" +
        "<div class='sheet-cam-lines'>" +
          "<div class='sheet-cam-line'>" + txSpan("1ch：" + cam.ch1) + "</div>" +
          "<div class='sheet-cam-line'>" + txSpan("2ch：" + cam.ch2) + "</div>" +
        "</div>" +
      "</div>";
    el.appendChild(block);
  });

  if(sh.memo){
    var memo = document.createElement("div");
    memo.className = "sheet-memo";
    memo.innerHTML = txSpan(sh.memo);
    el.appendChild(memo);
  }

  if(sh.staff){
    var staff = document.createElement("div");
    staff.className = "sheet-staff";
    staff.innerHTML = txSpan("収録担当：" + sh.staff);
    el.appendChild(staff);
  }
  return el;
}

function shrinkTitle(sheetEl){
  var t = sheetEl.querySelector(".sheet-title");
  if(!t) return;
  var size = 27;
  t.style.fontSize = size + "px";
  while(size > 10 && t.scrollWidth > t.clientWidth){
    size -= 1;
    t.style.fontSize = size + "px";
  }
}

/* ================= zoom & pan ================= */
function createZoom(viewport, stage, sizeFn){
  var zoom = 1, panX = 0, panY = 0;
  var pointers = new Map();
  var pinchStart = null;
  function apply(){
    var size = sizeFn();
    if(!size || !size.w || !size.h) return;
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    if(!vw || !vh) return;
    var fit = Math.min(vw / size.w, vh / size.h);
    var s = fit * zoom;
    var x = (vw - size.w * s) / 2 + panX;
    var y = (vh - size.h * s) / 2 + panY;
    stage.style.transform = "translate(" + x + "px," + y + "px) scale(" + s + ")";
    viewport.style.touchAction = zoom <= 1 ? "pan-y" : "none";
  }
  function setZoom(z){
    zoom = Math.min(5, Math.max(1, z));
    if(zoom === 1){ panX = 0; panY = 0; }
    apply();
  }
  viewport.addEventListener("pointerdown", function(e){
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 2){
      var pts = Array.from(pointers.values());
      pinchStart = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), zoom: zoom };
    }
  });
  viewport.addEventListener("pointermove", function(e){
    if(!pointers.has(e.pointerId)) return;
    var prev = pointers.get(e.pointerId);
    var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pointers.size === 2 && pinchStart){
      var pts = Array.from(pointers.values());
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if(pinchStart.d > 0) setZoom(pinchStart.zoom * d / pinchStart.d);
    } else if(pointers.size === 1 && zoom > 1){
      panX += dx; panY += dy;
      apply();
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinchStart = null;
  }
  viewport.addEventListener("pointerup", endPointer);
  viewport.addEventListener("pointercancel", endPointer);
  return {
    apply: apply,
    zoomIn: function(){ setZoom(zoom * 1.3); },
    zoomOut: function(){ setZoom(zoom / 1.3); },
    reset: function(){ setZoom(1); }
  };
}

/* preview */
var previewStage = document.getElementById("previewStage");
var previewViewport = document.getElementById("previewViewport");
var previewSheetEl = null;
var previewZoom = createZoom(previewViewport, previewStage, function(){
  if(!previewSheetEl) return null;
  return { w: 794, h: previewSheetEl.offsetHeight || 1123 };
});
function renderPreview(){
  var sh = activeSheet();
  previewStage.innerHTML = "";
  previewSheetEl = null;
  if(!sh) return;
  previewSheetEl = buildSheet(sh);
  previewStage.appendChild(previewSheetEl);
  shrinkTitle(previewSheetEl);
  requestAnimationFrame(function(){ previewZoom.apply(); });
}
var previewTimer = null;
function schedulePreview(immediate){
  if(immediate){ renderPreview(); return; }
  clearTimeout(previewTimer);
  previewTimer = setTimeout(renderPreview, 180);
}
document.getElementById("pvMinus").addEventListener("click", function(){ previewZoom.zoomOut(); });
document.getElementById("pvPlus").addEventListener("click", function(){ previewZoom.zoomIn(); });
document.getElementById("pvFit").addEventListener("click", function(){ previewZoom.reset(); });
window.addEventListener("resize", function(){ previewZoom.apply(); viewerZoom.apply(); });

/* ================= panel ================= */
var panelOverlay = document.getElementById("panelOverlay");
var panelBox = document.getElementById("panelBox");
function showPanel(message, buttons){
  panelBox.innerHTML = "";
  var p = document.createElement("p");
  p.textContent = message;
  panelBox.appendChild(p);
  buttons.forEach(function(b){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "out-btn " + (b.cls || "png");
    btn.textContent = b.label;
    btn.addEventListener("click", function(){
      hidePanel();
      if(b.action) b.action();
    });
    panelBox.appendChild(btn);
  });
  panelOverlay.hidden = false;
}
function hidePanel(){ panelOverlay.hidden = true; }
panelOverlay.addEventListener("click", function(e){ if(e.target === panelOverlay) hidePanel(); });

/* ================= capture & output ================= */
function setProcessing(on){ document.getElementById("processing").hidden = !on; }

function captureSheetCanvas(){
  var sh = activeSheet();
  var holder = document.createElement("div");
  holder.className = "capture-holder";
  var sheetEl = buildSheet(sh);
  holder.appendChild(sheetEl);
  document.body.appendChild(holder);
  shrinkTitle(sheetEl);
  return html2canvas(sheetEl, {
    scale: 4,
    backgroundColor: "#ffffff",
    logging: false,
    onclone: function(clonedDoc){
      /* html2canvas renders text ~0.49em too low; lift text spans in the
         capture clone by an amount proportional to font size. Decorations
         such as the underline live on the span itself and move with it. */
      var spans = clonedDoc.querySelectorAll(".sheet .tx");
      spans.forEach(function(s){
        s.style.display = "inline-block";
        s.style.transform = "translateY(-0.49em)";
      });
    }
  }).then(function(canvas){
    holder.remove();
    return canvas;
  }).catch(function(err){
    holder.remove();
    throw err;
  });
}

function fileBase(sh){
  var name = (sh.program || fmtDate(sh.date) || "シート").replace(/[\\\/:*?"<>|]/g, "_");
  return "チャンネル分け表_" + name;
}
function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function shareOrDownload(blob, filename){
  var file = null;
  try{ file = new File([blob], filename, { type: blob.type }); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file] }).catch(function(err){
      if(err && err.name !== "AbortError") downloadBlob(blob, filename);
    });
  } else {
    downloadBlob(blob, filename);
  }
}
function canvasToPdfBlob(canvas){
  var img = canvas.toDataURL("image/png");
  var wmm = 210;
  var hmm = 210 * canvas.height / canvas.width;
  var JsPDF = window.jspdf.jsPDF;
  var pdf = new JsPDF({
    orientation: hmm >= wmm ? "portrait" : "landscape",
    unit: "mm",
    format: [wmm, hmm],
    compress: false
  });
  pdf.addImage(img, "PNG", 0, 0, wmm, hmm, undefined, "NONE");
  return pdf.output("blob");
}

var viewerStage = document.getElementById("viewerStage");

var viewerImg = null;
var viewerZoom = createZoom(viewerViewport, viewerStage, function(){

function openViewer(imgSrc, shareAction){

  viewerImg.src = imgSrc;
  viewerImg.alt = "出力されたシート";
  viewerImg.style.width = "794px";

  viewerImg.draggable = false;
  viewerStage.appendChild(viewerImg);
  viewerShareAction = shareAction;
  viewer.hidden = false;
  viewerImg.onload = function(){ viewerZoom.reset(); };
  requestAnimationFrame(function(){ viewerZoom.reset(); });
}

document.getElementById("viewerShare").addEventListener("click", function(){

function outputError(){
  showPanel("出力に失敗しました。もう一度お試しください。", [{ label: "閉じる", cls: "png", action: null }]);
}

document.getElementById("btnPdfOpen").addEventListener("click", function(){
  if(!activeSheet()) return;
  setProcessing(true);
  Promise.resolve().then(captureSheetCanvas).then(function(canvas){
    setProcessing(false);
    var pdfBlob = canvasToPdfBlob(canvas);
    var fname = fileBase(activeSheet()) + ".pdf";
    openViewer(canvas.toDataURL("image/png"), function(){ shareOrDownload(pdfBlob, fname); });
  }).catch(function(){ setProcessing(false); outputError(); });
});
document.getElementById("btnPng").addEventListener("click", function(){
  if(!activeSheet()) return;
  setProcessing(true);
  Promise.resolve().then(captureSheetCanvas).then(function(canvas){
    canvas.toBlob(function(blob){
      setProcessing(false);
      if(!blob){ outputError(); return; }
      var fname = fileBase(activeSheet()) + ".png";
      var url = URL.createObjectURL(blob);
      showPanel("画像（PNG）を出力しました。", [
        { label: "画像を開く", cls: "pdf-open", action: function(){
            openViewer(url, function(){ shareOrDownload(blob, fname); });
          } },
        { label: "保存・共有する", cls: "pdf", action: function(){ shareOrDownload(blob, fname); } },
        { label: "閉じる", cls: "png", action: null }
      ]);
    }, "image/png");
  }).catch(function(){ setProcessing(false); outputError(); });
});
document.getElementById("btnPdf").addEventListener("click", function(){
  if(!activeSheet()) return;
  setProcessing(true);
  Promise.resolve().then(captureSheetCanvas).then(function(canvas){
    setProcessing(false);
    var pdfBlob = canvasToPdfBlob(canvas);
    var fname = fileBase(activeSheet()) + ".pdf";
    showPanel("PDFを出力しました。", [
      { label: "PDFを開く", cls: "pdf-open", action: function(){
          openViewer(canvas.toDataURL("image/png"), function(){ shareOrDownload(pdfBlob, fname); });
        } },
      { label: "保存・共有する", cls: "pdf", action: function(){ shareOrDownload(pdfBlob, fname); } },
      { label: "閉じる", cls: "png", action: null }
    ]);
  }).catch(function(){ setProcessing(false); outputError(); });
});

/* ================= init ================= */
loadState();
refreshChrome();
renderPills();
renderEditor();
renderPreview();
    </script>
  </body>
</html>
